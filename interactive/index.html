<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集 · 交互版 | 材料成型及控制工程</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===================== Token ===================== */
:root{
  --paper:#F7F6F3;
  --paper-deep:#EFEDE8;
  --ink:#1B1B1B;
  --ink-soft:#4A4A46;
  --gray:#6E6E68;
  --gray-light:#9A9A93;
  --line:#D8D6CE;
  --line-strong:#B9B6AC;
  --dark:#171716;
  --dark-line:#3A3A38;
  --accent:#C8C4B8;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}
::selection{background:var(--ink);color:var(--paper);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;}
.container{max-width:1160px;margin:0 auto;padding:0 40px;}
@media(max-width:768px){.container{padding:0 22px;}}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--gray);text-transform:uppercase;font-weight:500;}

/* ===================== 视图切换 ===================== */
.view{display:none;}
.view.active{display:block;animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ===================== Hero 封面 ===================== */
.hero{
  background:var(--dark);color:var(--paper);min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
}
.hero-grid{
  position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(var(--dark-line) 1px,transparent 1px),linear-gradient(90deg,var(--dark-line) 1px,transparent 1px);
  background-size:64px 64px;
}
.hero-inner{position:relative;padding:80px 0;}
.hero .name{font-size:clamp(44px,9vw,104px);font-weight:700;letter-spacing:.02em;line-height:1.08;}
.hero .name .thin{font-weight:300;color:var(--accent);}
.hero .intent{margin-top:34px;font-size:clamp(16px,2.4vw,22px);letter-spacing:.06em;font-weight:400;}
.hero .meta{margin-top:52px;border-top:1px solid var(--dark-line);padding-top:26px;display:flex;flex-wrap:wrap;gap:14px 0;}
.hero .meta-item{display:flex;gap:10px;font-size:14px;color:var(--accent);letter-spacing:.05em;align-items:center;}
.hero .meta-item+.meta-item::before{content:"";width:1px;height:14px;background:var(--dark-line);margin:0 22px;}
.hero .meta-item .k{color:var(--gray-light);}
@media(max-width:768px){
  .hero .meta{flex-direction:column;align-items:flex-start;gap:10px;}
  .hero .meta-item+.meta-item::before{display:none;}
}
.enter{
  margin-top:64px;display:inline-flex;align-items:center;gap:14px;
  color:var(--accent);font-size:15px;letter-spacing:.18em;
  border-bottom:1px solid var(--dark-line);padding-bottom:10px;
  transition:color .25s,border-color .25s;
}
.enter:hover{color:#fff;border-color:var(--accent);}
.enter .arr{transition:transform .25s;display:inline-block;}
.enter:hover .arr{transform:translateY(3px);}

/* ===================== 总览视图 ===================== */
.gallery{max-width:1160px;margin:0 auto;padding:96px 40px 40px;}
@media(max-width:768px){.gallery{padding:56px 22px 30px;}}
.gallery-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:44px;gap:20px;}
.gallery-head .t{font-size:clamp(24px,4vw,40px);font-weight:700;letter-spacing:.04em;line-height:1.25;}
.gallery-head .code{font-size:13px;letter-spacing:.2em;color:var(--gray);padding-bottom:6px;}
@media(max-width:768px){.gallery-head{flex-direction:column;align-items:flex-start;}}
.proj-card{
  width:100%;text-align:left;display:flex;align-items:center;gap:32px;
  padding:30px 8px;border-bottom:1px solid var(--line);position:relative;
  transition:background .25s;
}
.proj-card:first-of-type{border-top:1px solid var(--line);}
.proj-card:hover{background:var(--paper-deep);}
.proj-card .idx{font-size:13px;letter-spacing:.16em;color:var(--gray);min-width:86px;font-variant-numeric:tabular-nums;}
.proj-card .mid{flex:1;}
.proj-card .nm{font-size:clamp(18px,2.6vw,26px);font-weight:600;letter-spacing:.03em;line-height:1.3;}
.proj-card .sub{font-size:13px;color:var(--gray);margin-top:6px;letter-spacing:.04em;}
.proj-card .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.proj-card .tag{
  font-size:12px;color:var(--ink-soft);border:1px solid var(--line-strong);
  padding:3px 12px;letter-spacing:.05em;
}
.proj-card .go{font-size:13px;color:var(--gray);letter-spacing:.1em;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.proj-card .go .arr{font-size:18px;transition:transform .25s;}
.proj-card:hover .go .arr{transform:translateX(5px);}
@media(max-width:768px){
  .proj-card{flex-direction:column;align-items:flex-start;gap:12px;padding:24px 4px;}
  .proj-card .go{align-self:flex-end;}
}

/* ===================== 详情视图 ===================== */
.detail-toolbar{
  position:sticky;top:0;z-index:50;background:rgba(247,246,243,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.detail-toolbar .in{max-width:1160px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
@media(max-width:768px){.detail-toolbar .in{padding:12px 22px;}}
.tb-left{display:flex;align-items:center;gap:18px;min-width:0;}
.tb-back{font-size:13px;letter-spacing:.08em;color:var(--gray);display:flex;align-items:center;gap:6px;padding:6px 0;}
.tb-back:hover{color:var(--ink);}
.tb-back .arr{font-size:16px;}
.tb-title{font-size:14px;font-weight:500;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-nav{
  font-size:12px;letter-spacing:.1em;color:var(--gray);border:1px solid var(--line-strong);
  padding:5px 14px;transition:all .2s;
}
.tb-nav:hover{border-color:var(--ink);color:var(--ink);}
.tb-nav:disabled{opacity:.3;cursor:default;border-color:var(--line);}

.detail-body{max-width:1160px;margin:0 auto;padding:72px 40px 90px;}
@media(max-width:768px){.detail-body{padding:48px 22px 60px;}}

.d-head{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:48px;}
.d-head .code{font-size:13px;letter-spacing:.2em;color:var(--gray);}
.d-head h2{font-size:clamp(24px,4vw,42px);font-weight:700;letter-spacing:.03em;line-height:1.25;margin-top:10px;}

.d-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:48px;margin-bottom:56px;}
.d-points{border-top:1px solid var(--line);}
.d-point{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);}
.d-point .n{font-size:13px;color:var(--gray);letter-spacing:.1em;padding-top:3px;min-width:52px;}
.d-point .c{font-size:15px;color:var(--ink);}
.d-point .c b{font-weight:600;}
.d-brief{font-size:15px;color:var(--ink-soft);line-height:1.9;}
.d-brief p+p{margin-top:14px;}
@media(max-width:768px){.d-grid{grid-template-columns:1fr;gap:30px;}}

.d-sub{font-size:13px;letter-spacing:.18em;color:var(--gray);margin:48px 0 20px;display:flex;align-items:center;gap:14px;}
.d-sub::after{content:"";flex:1;height:1px;background:var(--line);}

.dwg-hero{border:1px solid var(--line-strong);background:#fff;margin-bottom:36px;}
.dwg-hero .frame{padding:14px;cursor:zoom-in;}
.dwg-hero img{width:100%;height:auto;display:block;}
.dwg-hero .tag{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--gray);letter-spacing:.08em;}

.dwg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.dwg-grid .cell{border:1px solid var(--line);background:#fff;cursor:zoom-in;display:flex;flex-direction:column;transition:border-color .2s;}
.dwg-grid .cell:hover{border-color:var(--ink);}
.dwg-grid .thumb{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;}
.dwg-grid .thumb img{max-width:100%;max-height:260px;display:block;}
.dwg-grid .cap{border-top:1px solid var(--line);padding:9px 12px;font-size:12.5px;color:var(--gray);display:flex;justify-content:space-between;gap:8px;}
.dwg-grid .cap .nm{color:var(--ink-soft);}
.dwg-grid .cap .no{color:var(--gray-light);}
@media(max-width:768px){.dwg-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
@media(max-width:480px){.dwg-grid{grid-template-columns:1fr;}}

.mgmt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.mgmt-grid .cell{border:1px solid var(--line);background:#fff;cursor:zoom-in;}
.mgmt-grid .thumb{padding:14px;display:flex;align-items:center;justify-content:center;}
.mgmt-grid .thumb img{max-height:320px;width:100%;object-fit:contain;}
.mgmt-grid .cap{border-top:1px solid var(--line);padding:9px 12px;font-size:12.5px;color:var(--gray);display:flex;justify-content:space-between;}
@media(max-width:768px){.mgmt-grid{grid-template-columns:1fr;}}

/* 文字型项目（无图纸） */
.text-feature{border-left:2px solid var(--ink);padding:6px 0 6px 26px;margin-bottom:22px;}
.text-feature .t{font-size:16px;font-weight:600;letter-spacing:.02em;}
.text-feature .d{font-size:14.5px;color:var(--ink-soft);margin-top:6px;line-height:1.8;}

/* ===================== 页脚 ===================== */
.foot{background:var(--dark);color:var(--gray-light);font-size:12px;letter-spacing:.1em;padding:26px 0;}
.foot .in{max-width:1160px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
@media(max-width:768px){.foot .in{padding:0 22px;}}

/* ===================== Lightbox ===================== */
.lightbox{position:fixed;inset:0;background:rgba(15,15,14,.96);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:40px;cursor:zoom-out;}
.lightbox.open{display:flex;}
.lightbox img{max-width:94vw;max-height:82vh;object-fit:contain;background:#fff;}
.lightbox .lb-cap{color:#B9B6AC;margin-top:18px;font-size:14px;letter-spacing:.06em;text-align:center;}
.lightbox .lb-close{position:absolute;top:22px;right:28px;color:#B9B6AC;font-size:30px;cursor:pointer;line-height:1;}
</style>
</head>

</div>

</div>

/* ===================== 视图状态 ===================== */
var currentIndex = 0;
function $(sel){ return document.querySelector(sel); }

function switchView(name){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  $('#' + name).classList.add('active');
  window.scrollTo({top:0, behavior:'auto'});
}

/* ===================== 渲染总览卡片 ===================== */
function renderCards(){
  var list = $('#cardList');
  list.innerHTML = PROJECTS.map(function(p, i){
    return '<button class="proj-card" data-i="' + i + '">' +
      '<div class="idx">' + p.id + '</div>' +
      '<div class="mid">' +
        '<div class="nm">' + p.title + '</div>' +
        '<div class="sub">' + p.tag + '</div>' +
        '<div class="tags">' + p.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
      '</div>' +
      '<div class="go">查看作品 <span class="arr">→</span></div>' +
    '</button>';
  }).join('');
  list.querySelectorAll('.proj-card').forEach(function(card){
    card.addEventListener('click', function(){
      openProject(parseInt(card.getAttribute('data-i'), 10));
    });
  });
}

/* ===================== 渲染详情 ===================== */
function openProject(i){
  currentIndex = i;
  var p = PROJECTS[i];
  $('#tbTitle').textContent = p.id + ' · ' + p.title;
  $('#btnPrev').disabled = (i === 0);
  $('#btnNext').disabled = (i === PROJECTS.length - 1);

  var html = '';
  html += '<div class="d-head">' +
    '<div class="code">' + p.code + ' · ' + p.tag + '</div>' +
    '<h2>' + p.title + '</h2>' +
  '</div>';

  html += '<div class="d-grid">' +
    '<div class="d-points">' + p.points.map(function(pt){
      return '<div class="d-point"><div class="n">' + pt.n + '</div><div class="c">' + pt.c + '</div></div>';
    }).join('') + '</div>' +
    '<div class="d-brief">' + p.brief.map(function(b){ return '<p>' + b + '</p>'; }).join('') + '</div>' +
  '</div>';

  // 图纸区
  if(p.hero){
    html += '<div class="d-sub">图纸 · DRAWINGS</div>';
    html += '<div class="dwg-hero" data-zoom="' + p.hero.cap + '">' +
      '<div class="frame"><img src="' + p.hero.img + '" alt="' + p.hero.cap + '" loading="lazy"></div>' +
      '<div class="tag"><span>' + p.hero.cap + '</span><span>' + p.hero.no + '</span></div>' +
    '</div>';
  }
  if(p.figs && p.figs.length){
    var gridCls = (p.figs.length > 3) ? 'mgmt-grid' : 'dwg-grid';
    html += '<div class="' + gridCls + '">' + p.figs.map(function(f){
      return '<div class="cell" data-zoom="' + f.nm + '">' +
        '<div class="thumb"><img src="' + f.img + '" alt="' + f.nm + '" loading="lazy"></div>' +
        '<div class="cap"><span class="nm">' + f.nm + '</span><span class="no">' + f.no + '</span></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  // 文字型项目（无图纸）
  if(p.features){
    html += '<div class="d-sub">要点 · KEY POINTS</div>';
    html += p.features.map(function(f){
      return '<div class="text-feature"><div class="t">' + f.t + '</div><div class="d">' + f.d + '</div></div>';
    }).join('');
  }

  $('#detailBody').innerHTML = html;
  bindZoom();
  switchView('view-detail');
}

function bindZoom(){
  document.querySelectorAll('#detailBody [data-zoom]').forEach(function(el){
    el.addEventListener('click', function(){
      var img = el.querySelector('img');
      if(img){
        $('#lbImg').src = img.src;
        $('#lbImg').alt = img.alt || '';
        $('#lbCap').textContent = el.getAttribute('data-zoom');
        $('#lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    });
    el.style.cursor = 'zoom-in';
  });
}

/* ===================== 事件绑定 ===================== */
$('#enterBtn').addEventListener('click', function(){ renderCards(); switchView('view-gallery'); });
$('#btnBack').addEventListener('click', function(){ renderCards(); switchView('view-gallery'); });
$('#btnPrev').addEventListener('click', function(){ if(currentIndex > 0) openProject(currentIndex - 1); });
$('#btnNext').addEventListener('click', function(){ if(currentIndex < PROJECTS.length - 1) openProject(currentIndex + 1); });

// 键盘交互：左右切换项目，Esc 返回 / 关闭放大
document.addEventListener('keydown', function(e){
  if($('#lightbox').classList.contains('open')){
    if(e.key === 'Escape') closeLB();
    return;
  }
  if($('#view-detail').classList.contains('active')){
    if(e.key === 'ArrowRight' && currentIndex < PROJECTS.length - 1) openProject(currentIndex + 1);
    if(e.key === 'ArrowLeft' && currentIndex > 0) openProject(currentIndex - 1);
    if(e.key === 'Escape'){ renderCards(); switchView('view-gallery'); }
  }
});

var lb = $('#lightbox');
function closeLB(){
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
lb.addEventListener('click', function(e){ if(e.target === lb || e.target === $('#lbClose')) closeLB(); });

// 首屏：预渲染卡片，避免首次点击闪烁
renderCards();
</script>
